aid: inkblot-therapy
name: Inkblot Therapy
description: >-
  Inkblot Therapy is a Canadian digital mental health platform, part of GreenShield,
  that delivers secure virtual therapy and counselling online. It matches individuals
  to licensed counsellors, social workers, psychotherapists, and psychologists using a
  clinically designed questionnaire, and delivers confidential video sessions. Inkblot
  serves individuals directly, employers and organizations through Employee Assistance
  Programs (EAP) and mental health benefits, and practitioners who provide care on the
  platform. The company operates consumer and business web applications
  (app.inkblottherapy.com, business.inkblottherapy.com) but does not publish a public
  developer program, API documentation, SDKs, or an OpenAPI description. This profile
  was surfaced as a Techstars portfolio company and added to the API Evangelist network
  as a lead; enrichment reflects the public web and DNS/security surface only.
